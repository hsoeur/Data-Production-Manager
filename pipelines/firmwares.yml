trigger:
  branches:
    include:
      - main
      - codex/develop/firmwares
  paths:
    include:
      - apps/firmwares/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - pipelines/firmwares.yml
      - pipelines/azure/templates/deploy-client.yml

pr:
  branches:
    include:
      - main
      - codex/develop/firmwares
  paths:
    include:
      - apps/firmwares/**
      - packages/shared/**
      - package.json
      - package-lock.json

extends:
  template: azure/templates/deploy-client.yml
  parameters:
    displayName: Firmwares
    dockerfile: apps/firmwares/Dockerfile
    imageName: ui_firmware2_v2_image
    artifactName: docker-image-firmwares
    serverPath: 'C:\Deploy\containers\ui_firmware2_v2_container'
    containerName: ui_firmware2_v2_container
    appPort: '12007'

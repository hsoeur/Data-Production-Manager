trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/templates/*
      - packages/shared/*
      - package.json
      - package-lock.json
      - pipelines/templates.yml

pool:
  name: Default
  demands:
    - agent.name -equals VM-DEVOPS

variables:
  IMAGE_NAME: "ui_templates_v2"
  SERVER_USER: "adminprod"
  SERVER_IP: "192.168.1.104"
  SERVER_PATH: 'C:\Deploy\containers\ui_templates_v2'
  CONTAINER_NAME: "ui-templates-v2"
  APP_PORT: "12006"
  CONTAINER_PORT: "80"
  API_BASE_URL: "http://192.168.1.104:10001/api"
  ARTIFACT_NAME: "docker-image-templates"

stages:
  - stage: Build
    displayName: "Prepare Templates Docker Image"
    jobs:
      - job: Build
        displayName: "Prepare Docker artifact"
        steps:
          - script: |
              echo "Building Docker image..."
              docker build -t $(IMAGE_NAME):latest -f apps/templates/Dockerfile .
            displayName: "Build Docker"

          - script: |
              echo "Saving Docker image..."
              docker save $(IMAGE_NAME):latest -o "$(Build.ArtifactStagingDirectory)\$(IMAGE_NAME).tar"
            displayName: "Save Docker image"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Docker image artifact"
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)\$(IMAGE_NAME).tar'
              artifactName: "$(ARTIFACT_NAME)"

  - stage: Deploy
    displayName: "Deploy Templates on port 12006"
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: "Deploy over SSH"
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: "Download Docker image artifact"
            inputs:
              buildType: "current"
              artifactName: "$(ARTIFACT_NAME)"
              downloadPath: "$(Pipeline.Workspace)"

          - script: |
              echo "Creating remote deployment directory..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "mkdir -p $(SERVER_PATH)"
              pscp -batch -pw "$(SSH_PASSWORD)" "$(Pipeline.Workspace)/$(ARTIFACT_NAME)/$(IMAGE_NAME).tar" $(SERVER_USER)@$(SERVER_IP):$(SERVER_PATH)/
            displayName: "Transfer Docker image"

          - script: |
              echo "Stopping the previous container, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker stop $(CONTAINER_NAME) || exit 0"
            displayName: "Stop previous container"

          - script: |
              echo "Removing the previous container, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rm $(CONTAINER_NAME) || exit 0"
            displayName: "Remove previous container"

          - script: |
              echo "Removing the previous image, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rmi $(IMAGE_NAME):latest || exit 0"
            displayName: "Remove previous image"

          - script: |
              echo "Loading new Docker image..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker load -i $(SERVER_PATH)/$(IMAGE_NAME).tar"
            displayName: "Load new Docker image"

          - script: |
              echo "Starting Templates on port $(APP_PORT)..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker run -d --name $(CONTAINER_NAME) --restart unless-stopped -p $(APP_PORT):$(CONTAINER_PORT) -e API_DATA_BASE_URL=$(API_BASE_URL) $(IMAGE_NAME):latest"
            displayName: "Start Templates container"

          - script: |
              echo "Checking Templates container..."
              curl.exe --fail --silent --show-error --max-time 30 http://$(SERVER_IP):$(APP_PORT)/ > NUL
              echo "Templates is responding on port $(APP_PORT)."
            displayName: "Verify Templates container"

trigger:
  branches:
    include:
      - main
      - codex/develop/templates
  paths:
    include:
      - apps/templates/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - pipelines/templates.yml
      - pipelines/azure/templates/deploy-client.yml

pr:
  branches:
    include:
      - main
      - codex/develop/templates
  paths:
    include:
      - apps/templates/**
      - packages/shared/**
      - package.json
      - package-lock.json

extends:
  template: azure/templates/deploy-client.yml
  parameters:
    displayName: Templates
    dockerfile: apps/templates/Dockerfile
    imageName: ui_templates_v2
    artifactName: docker-image-templates
    serverPath: 'C:\Deploy\containers\ui_templates_v2'
    containerName: ui-templates-v2
    appPort: '12006'

trigger:
  branches:
    include:
      - main
      - codex/develop/templates
      - codex/feature/templates/*
  paths:
    include:
      - apps/templates/*
      - packages/shared/*
      - package.json
      - package-lock.json
      - pipelines/templates.yml

pr:
  paths:
    include:
      - apps/templates/*
      - packages/shared/*
      - package.json
      - package-lock.json

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: 22.13.0
    displayName: Use Node.js 22.13
  - script: npm ci
    displayName: Install workspaces
  - script: npm run build:templates
    displayName: Build Templates
  - publish: apps/templates/dist
    artifact: pdm-templates
    displayName: Publish Templates artifact

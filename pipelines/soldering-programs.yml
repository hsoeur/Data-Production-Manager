trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/soldering-programs/*
      - packages/shared/*
      - package.json
      - package-lock.json
      - pipelines/soldering-programs.yml

pool:
  name: Default
  demands:
    - agent.name -equals VM-DEVOPS

variables:
  IMAGE_NAME: "ui_programs_v2_image"
  SERVER_USER: "adminprod"
  SERVER_IP: "192.168.1.104"
  SERVER_PATH: 'C:\Deploy\containers\ui_programs_v2_container'
  CONTAINER_NAME: "ui_programs_v2_container"
  APP_PORT: "12008"
  CONTAINER_PORT: "80"
  API_BASE_URL: "http://192.168.1.104:10001/api"
  ARTIFACT_NAME: "docker-image-soldering-programs"
  BUILDER_IMAGE: "pdm-build-deps:c3fda0e48f41"

stages:
  - stage: Build
    displayName: "Prepare Soldering Programs Docker Image"
    jobs:
      - job: Build
        displayName: "Prepare Docker artifact"
        steps:
          - script: |
              docker image inspect $(BUILDER_IMAGE) > NUL 2>&1
              if errorlevel 1 (
                echo "Missing offline builder image: $(BUILDER_IMAGE)"
                exit /b 1
              )
              docker image inspect nginx:1.29-alpine > NUL 2>&1
              if errorlevel 1 (
                echo "Missing offline runtime image: nginx:1.29-alpine"
                exit /b 1
              )
              echo "Building Docker image..."
              docker build --pull=false --network=none --build-arg BUILDER_IMAGE=$(BUILDER_IMAGE) -t $(IMAGE_NAME):latest -f apps/soldering-programs/Dockerfile .
            displayName: "Build Docker"

          - script: |
              echo "Saving Docker image..."
              docker save $(IMAGE_NAME):latest -o "$(Build.ArtifactStagingDirectory)\$(IMAGE_NAME).tar"
            displayName: "Save Docker image"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Docker image artifact"
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)\$(IMAGE_NAME).tar'
              artifactName: "$(ARTIFACT_NAME)"

  - stage: Deploy
    displayName: "Deploy Soldering Programs on port 12008"
    dependsOn: Build
    jobs:
      - job: Deploy
        displayName: "Deploy over SSH"
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: "Download Docker image artifact"
            inputs:
              buildType: "current"
              artifactName: "$(ARTIFACT_NAME)"
              downloadPath: "$(Pipeline.Workspace)"

          - script: |
              echo "Creating remote deployment directory..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "if not exist $(SERVER_PATH) mkdir $(SERVER_PATH)"
              pscp -batch -pw "$(SSH_PASSWORD)" "$(Pipeline.Workspace)\$(ARTIFACT_NAME)\$(IMAGE_NAME).tar" $(SERVER_USER)@$(SERVER_IP):$(SERVER_PATH)\$(IMAGE_NAME).tar
            displayName: "Transfer Docker image"

          - script: |
              echo "Stopping the previous container, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker stop $(CONTAINER_NAME) || exit /b 0"
            displayName: "Stop previous container"

          - script: |
              echo "Removing the previous container, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rm $(CONTAINER_NAME) || exit /b 0"
            displayName: "Remove previous container"

          - script: |
              echo "Removing the previous image, if present..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker rmi $(IMAGE_NAME):latest || exit /b 0"
            displayName: "Remove previous image"

          - script: |
              echo "Loading new Docker image..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker load -i $(SERVER_PATH)\$(IMAGE_NAME).tar"
            displayName: "Load new Docker image"

          - script: |
              echo "Starting Soldering Programs on port $(APP_PORT)..."
              plink -batch -pw "$(SSH_PASSWORD)" $(SERVER_USER)@$(SERVER_IP) "docker run -d --name $(CONTAINER_NAME) --restart unless-stopped -p $(APP_PORT):$(CONTAINER_PORT) -e API_DATA_BASE_URL=$(API_BASE_URL) $(IMAGE_NAME):latest"
            displayName: "Start Soldering Programs container"

          - script: |
              echo "Checking Soldering Programs container..."
              curl.exe --fail --silent --show-error --max-time 30 http://$(SERVER_IP):$(APP_PORT)/ > NUL
              echo "Soldering Programs is responding on port $(APP_PORT)."
            displayName: "Verify Soldering Programs container"

trigger:
  branches:
    include:
      - main
      - codex/develop/tolerances
  paths:
    include:
      - apps/tolerances/**
      - packages/shared/**
      - package.json
      - package-lock.json
      - pipelines/tolerances.yml
      - pipelines/azure/templates/deploy-client.yml

pr:
  branches:
    include:
      - main
      - codex/develop/tolerances
  paths:
    include:
      - apps/tolerances/**
      - packages/shared/**
      - package.json
      - package-lock.json

extends:
  template: azure/templates/deploy-client.yml
  parameters:
    displayName: Tolerances
    dockerfile: apps/tolerances/Dockerfile
    imageName: ui_tolerance_manager_v2_image
    artifactName: docker-image-tolerances
    serverPath: 'C:\Deploy\containers\ui_tolerance_manager_v2_container'
    containerName: ui_tolerance_manager_v2_container
    appPort: '12005'
